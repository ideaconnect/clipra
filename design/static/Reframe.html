<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipra - Auto-reframe (static snapshot)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  
x-dc{display:none!important}

body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}

</style>
</head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="Reframe"><div data-dc-tpl="3" style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: rgb(13, 13, 15); color: rgb(244, 243, 239); font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header data-dc-tpl="4" style="height: 48px; padding: 0px 20px 0px 6px; display: flex; align-items: center; gap: 6px;">
    <a data-dc-tpl="5" href="Editor.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgb(244, 243, 239); border-radius: 12px;">
      <svg data-dc-tpl="6" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-tpl="7" d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span data-dc-tpl="8" style="flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; gap: 1px;">
      <span data-dc-tpl="9" style="font-size: 15px; font-weight: 600;">Auto-reframe</span>
      <span data-dc-tpl="10" style="font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 11px; color: rgb(166, 165, 173);">Lisbon weekend · 16:9 → <span class="sc-interp">9:16</span></span>
    </span>
  </header>

  <div data-dc-tpl="11" style="padding: 8px 16px 0px; display: flex; flex-direction: column; gap: 6px;">
    <div data-dc-tpl="12" role="img" aria-label="Source frame with a 9:16 crop window that follows the subject" style="position: relative; width: 358px; height: 201px; overflow: hidden; border-radius: 6px;">
      <div data-dc-tpl="13" style="position: absolute; inset: 0px; background: linear-gradient(rgb(35, 48, 92) 0%, rgb(107, 77, 122) 36%, rgb(217, 120, 90) 66%, rgb(243, 176, 100) 100%);"></div>
      <div data-dc-tpl="14" style="position: absolute; left: 70%; top: 20%; width: 10%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgb(255, 230, 168);"></div>
      <div data-dc-tpl="15" style="position: absolute; left: -10%; right: 40%; top: 60%; height: 80%; border-radius: 50%; background: rgb(74, 51, 85);"></div>
      <div data-dc-tpl="16" style="position: absolute; left: 40%; right: -20%; top: 70%; height: 80%; border-radius: 50%; background: rgb(34, 25, 46);"></div>
      <div data-dc-tpl="17" style="position: absolute; inset: 0px; transform: translateX(14%);">
        <div data-dc-tpl="18" style="position: absolute; inset: 70% 38% -10%; border-radius: 48% 48% 0px 0px; background: rgb(47, 74, 122);"></div>
        <div data-dc-tpl="19" style="position: absolute; left: 48.2%; width: 3.6%; top: 58%; height: 14%; background: rgb(185, 122, 91);"></div>
        <div data-dc-tpl="20" style="position: absolute; left: 45.4%; width: 9.2%; top: 41%; height: 20%; border-radius: 50%; background: rgb(201, 139, 107);"></div>
        <div data-dc-tpl="21" style="position: absolute; left: 45%; width: 10%; top: 39%; height: 10%; border-radius: 50% 50% 30% 30%; background: rgb(43, 30, 26);"></div>
      </div>
      
        
      
      
      <div data-dc-tpl="27" aria-hidden="true" style="position: absolute; top: 0px; left: 173px; width: 113px; height: 201px; border: 2px solid rgb(255, 210, 63); box-sizing: border-box; box-shadow: rgba(13, 13, 15, 0.62) 0px 0px 0px 999px;"></div>
      <span data-dc-tpl="28" style="position: absolute; left: 8px; bottom: 8px; padding: 2px 6px; border-radius: 5px; background: rgba(13, 13, 15, 0.85); font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 10px;">Source 16:9 · 00:07.12</span>
    </div>
  </div>

  <div data-dc-tpl="29" style="padding: 12px 16px 0px; display: flex; align-items: center; gap: 14px;">
    <div data-dc-tpl="30" role="img" aria-label="Reframed 9:16 result" style="position: relative; width: 90px; height: 160px; overflow: hidden; border-radius: 6px; flex-shrink: 0; outline: rgb(42, 42, 48) solid 1px;">
      <div data-dc-tpl="31" style="position: absolute; left: 0px; top: 0px; width: 358px; height: 201px; transform-origin: 0px 0px; transform: scale(0.796) translateX(-173px);">
        <div data-dc-tpl="32" style="position: absolute; inset: 0px; background: linear-gradient(rgb(35, 48, 92) 0%, rgb(107, 77, 122) 36%, rgb(217, 120, 90) 66%, rgb(243, 176, 100) 100%);"></div>
        <div data-dc-tpl="33" style="position: absolute; left: 70%; top: 20%; width: 10%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgb(255, 230, 168);"></div>
        <div data-dc-tpl="34" style="position: absolute; left: -10%; right: 40%; top: 60%; height: 80%; border-radius: 50%; background: rgb(74, 51, 85);"></div>
        <div data-dc-tpl="35" style="position: absolute; left: 40%; right: -20%; top: 70%; height: 80%; border-radius: 50%; background: rgb(34, 25, 46);"></div>
        <div data-dc-tpl="36" style="position: absolute; inset: 0px; transform: translateX(14%);">
          <div data-dc-tpl="37" style="position: absolute; inset: 70% 38% -10%; border-radius: 48% 48% 0px 0px; background: rgb(47, 74, 122);"></div>
          <div data-dc-tpl="38" style="position: absolute; left: 48.2%; width: 3.6%; top: 58%; height: 14%; background: rgb(185, 122, 91);"></div>
          <div data-dc-tpl="39" style="position: absolute; left: 45.4%; width: 9.2%; top: 41%; height: 20%; border-radius: 50%; background: rgb(201, 139, 107);"></div>
          <div data-dc-tpl="40" style="position: absolute; left: 45%; width: 10%; top: 39%; height: 10%; border-radius: 50% 50% 30% 30%; background: rgb(43, 30, 26);"></div>
        </div>
      </div>
      
        <div data-dc-tpl="42" style="position: absolute; left: 6px; right: 6px; bottom: 12px; display: flex; justify-content: center;">
          <span data-dc-tpl="43" style="padding: 2px 4px; border-radius: 3px; background: rgba(0, 0, 0, 0.65); font-size: 7px; font-weight: 700; color: rgb(255, 255, 255); text-align: center;">We finally made it to Lisbon</span>
        </div>
      
    </div>
    <div data-dc-tpl="44" style="display: flex; flex-direction: column; gap: 6px;">
      <span data-dc-tpl="45" style="font-size: 13px; font-weight: 600;">Result · <span class="sc-interp">9:16</span></span>
      <span data-dc-tpl="46" style="font-size: 12px; color: rgb(166, 165, 173); line-height: 1.45;">Every shot is tracked on the phone. The crop follows the subject, and you can adjust the path later with keyframes.</span>
    </div>
  </div>

  <div data-dc-tpl="47" style="flex: 1 1 0%; min-height: 0px; padding: 12px 16px 0px; display: flex; flex-direction: column; gap: 10px;">
    <section data-dc-tpl="48" style="display: flex; flex-direction: column; gap: 6px;">
      <h2 data-dc-tpl="49" style="margin: 0px; font-size: 13px; font-weight: 600; color: rgb(166, 165, 173);">New format</h2>
      <div data-dc-tpl="50" role="radiogroup" aria-label="New format" style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgb(23, 23, 26);">
        
          <button data-dc-tpl="52" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; background: rgb(244, 243, 239); color: rgb(13, 13, 15); font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 14px; font-weight: 600;"><span class="sc-interp">9:16</span></button>
        
          <button data-dc-tpl="52" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; background: transparent; color: rgb(180, 179, 187); font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 14px; font-weight: 600;"><span class="sc-interp">1:1</span></button>
        
          <button data-dc-tpl="52" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; background: transparent; color: rgb(180, 179, 187); font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 14px; font-weight: 600;"><span class="sc-interp">4:5</span></button>
        
      </div>
    </section>
    <section data-dc-tpl="53" style="display: flex; flex-direction: column; gap: 6px;">
      <h2 data-dc-tpl="54" style="margin: 0px; font-size: 13px; font-weight: 600; color: rgb(166, 165, 173);">Follow</h2>
      <div data-dc-tpl="55" role="radiogroup" aria-label="Follow" style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgb(23, 23, 26);">
        
          <button data-dc-tpl="57" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; background: rgb(244, 243, 239); color: rgb(13, 13, 15); font-size: 13px; font-weight: 600;"><span class="sc-interp">Subject</span></button>
        
          <button data-dc-tpl="57" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; background: transparent; color: rgb(180, 179, 187); font-size: 13px; font-weight: 600;"><span class="sc-interp">Face</span></button>
        
          <button data-dc-tpl="57" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; background: transparent; color: rgb(180, 179, 187); font-size: 13px; font-weight: 600;"><span class="sc-interp">Fixed</span></button>
        
      </div>
    </section>
    <div data-dc-tpl="58" style="height: 36px; display: flex; align-items: center; gap: 10px;">
      <label data-dc-tpl="59" for="cam" style="font-size: 13px; width: 100px;">Camera motion</label>
      <span data-dc-tpl="60" style="font-size: 11px; color: rgb(166, 165, 173);">Smooth</span>
      <input data-dc-tpl="61" id="cam" type="range" min="0" max="100" value="30" style="flex: 1 1 0%; accent-color: rgb(255, 210, 63); height: 24px;">
      <span data-dc-tpl="62" style="font-size: 11px; color: rgb(166, 165, 173);">Quick</span>
    </div>
    <button data-dc-tpl="63" role="switch" aria-checked="true" style="height: 44px; display: flex; align-items: center; gap: 12px; text-align: left;">
      <span data-dc-tpl="64" style="flex: 1 1 0%; font-size: 14px; font-weight: 500;">Keep titles and captions inside the frame</span>
      <span data-dc-tpl="65" style="width: 48px; height: 28px; border-radius: 14px; background: rgb(255, 210, 63); position: relative; display: block; flex-shrink: 0;">
        <span data-dc-tpl="66" style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 11px; background: rgb(20, 18, 16); display: block;"></span>
      </span>
    </button>
  </div>

  <div data-dc-tpl="67" style="padding: 10px 16px 26px;">
    <a data-dc-tpl="68" href="Editor.html" style="height: 56px; border-radius: 16px; background: rgb(255, 210, 63); color: rgb(20, 18, 16); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">Create <span class="sc-interp">9:16</span> copy</a>
  </div></div></div></div>
</body>
</html>
