<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipra - Export ad 1 of 2 (static snapshot)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  
x-dc{display:none!important}

body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}

</style>
</head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="AdStart"><div data-dc-tpl="3" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: rgb(0, 0, 0); color: rgb(244, 243, 239); font-family: Geist, system-ui, sans-serif; overflow: hidden;">

  <div data-dc-tpl="4" style="position: absolute; top: 40px; left: 14px; right: 14px; height: 44px; display: flex; align-items: center; justify-content: space-between;">
    <span data-dc-tpl="5" style="padding: 2px 7px; border-radius: 5px; background: rgb(244, 243, 239); color: rgb(0, 0, 0); font-size: 11px; font-weight: 700; letter-spacing: 0.02em;">Ad</span>
    
      <span data-dc-tpl="7" role="timer" aria-label="Ad can be closed in 4 seconds" style="width: 36px; height: 36px; margin-right: 4px; border-radius: 18px; border: 2px solid rgba(244, 243, 239, 0.55); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: &quot;Geist Mono&quot;, ui-monospace, monospace; font-size: 13px; font-weight: 600;"><span class="sc-interp">4</span></span>
    
    
  </div>

  <div data-dc-tpl="12" role="img" aria-label="Placeholder for the ad creative served by the ad network" style="position: absolute; inset: 100px 20px 168px; border-radius: 18px; border: 1.5px dashed rgb(58, 58, 64); box-sizing: border-box; background: repeating-linear-gradient(135deg, rgb(17, 17, 19) 0px, rgb(17, 17, 19) 14px, rgb(23, 23, 26) 14px, rgb(23, 23, 26) 28px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;">
    <span data-dc-tpl="13" style="width: 64px; height: 64px; border-radius: 16px; background: rgb(31, 31, 35); color: rgb(140, 139, 148); display: flex; align-items: center; justify-content: center;">
      <svg data-dc-tpl="14" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect data-dc-tpl="15" x="3" y="4" width="18" height="16" rx="3"></rect><circle data-dc-tpl="16" cx="9" cy="10" r="2"></circle><path data-dc-tpl="17" d="M21 16l-5-5-9 9"></path></svg>
    </span>
    <span data-dc-tpl="18" style="font-size: 16px; font-weight: 600; color: rgb(180, 179, 187);">[Ad creative]</span>
    <span data-dc-tpl="19" style="font-size: 12px; color: rgb(140, 139, 148); line-height: 1.5;">Image or video from the ad network.<br data-dc-tpl="20">Your video keeps rendering behind it.</span>
  </div>

  <div data-dc-tpl="21" style="position: absolute; left: 20px; right: 20px; bottom: 52px; height: 92px; border-radius: 18px; background: rgb(20, 20, 22); padding: 0px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;">
    <span data-dc-tpl="22" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: rgb(42, 42, 48); flex-shrink: 0; display: block;"></span>
    <span data-dc-tpl="23" style="flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; gap: 3px;">
      <span data-dc-tpl="24" style="font-size: 15px; font-weight: 600;">[Advertiser]</span>
      <span data-dc-tpl="25" style="font-size: 12px; color: rgb(166, 165, 173);">[One line of ad text]</span>
    </span>
    <span data-dc-tpl="26" style="height: 40px; padding: 0px 16px; border-radius: 20px; background: rgb(244, 243, 239); color: rgb(0, 0, 0); font-size: 13px; font-weight: 700; display: flex; align-items: center;">[Action]</span>
  </div></div></div></div>
</body>
</html>
