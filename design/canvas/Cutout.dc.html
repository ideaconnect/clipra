<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Background removal and chroma key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">Cutout</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">{{clipName}}</span>
    </span>
    <a href="Editor.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #FFD23F; color: #141210; font-size: 14px; font-weight: 700; display: flex; align-items: center">Done</a>
  </header>

  <div style="height: 330px; background: #000000; display: flex; align-items: center; justify-content: center">
    <div role="img" aria-label="{{previewLabel}}" style="position: relative; width: 186px; height: 330px; overflow: hidden">
      <sc-if value="{{bgBelow}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #16324F 0%, #2F6FA8 55%, #6E8FB5 100%)"></div>
        <div style="position: absolute; left: -5%; width: 45%; top: 26%; bottom: 30%; background-color: #24344D; background-image: radial-gradient(rgba(255,214,120,0.85) 1.5px, transparent 2px); background-size: 10px 12px"></div>
        <div style="position: absolute; right: -5%; width: 50%; top: 18%; bottom: 30%; background-color: #1E2B40; background-image: radial-gradient(rgba(255,214,120,0.7) 1.5px, transparent 2px); background-size: 11px 13px"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #1C2635"></div>
        <div style="position: absolute; left: 6%; right: 6%; top: 56%; height: 16%; border-radius: 12px 12px 4px 4px; background: #F2B705"></div>
      </sc-if>
      <sc-if value="{{bgBlur}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: -10px; filter: blur(7px)">
          <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
          <div style="position: absolute; left: 62%; top: 30%; width: 24%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
          <div style="position: absolute; left: -30%; right: 35%; top: 64%; height: 50%; border-radius: 50%; background: #4A3355"></div>
          <div style="position: absolute; left: 25%; right: -40%; top: 72%; height: 50%; border-radius: 50%; background: #22192E"></div>
        </div>
      </sc-if>
      <sc-if value="{{bgClear}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: 0; background: repeating-conic-gradient(#2A2A30 0 25%, #18181C 0 50%) 0 0 / 18px 18px"></div>
      </sc-if>
      <sc-if value="{{bgColor}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: 0; background: #FFD23F"></div>
      </sc-if>

      <div style="position: absolute; inset: 0; filter: drop-shadow(0 0 {{edgeGlow}}px rgba(255,255,255,0.35))">
        <div style="position: absolute; left: 21%; right: 21%; top: 74%; bottom: -6%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
        <div style="position: absolute; left: 45%; width: 10%; top: 66%; height: 10%; background: #B97A5B"></div>
        <div style="position: absolute; left: 37%; width: 26%; top: 50%; height: 18%; border-radius: 50%; background: #C98B6B"></div>
        <div style="position: absolute; left: 36%; width: 28%; top: 48.5%; height: 8.5%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
      </div>

      <sc-if value="{{isChroma}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" style="position: absolute; left: 8px; bottom: 8px; width: 50px; height: 88px; border-radius: 6px; border: 2px solid #F4F3EF; overflow: hidden; background: {{keyColor}}; box-sizing: border-box">
          <div style="position: absolute; left: 21%; right: 21%; top: 74%; bottom: -6%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
          <div style="position: absolute; left: 37%; width: 26%; top: 50%; height: 18%; border-radius: 50%; background: #C98B6B"></div>
          <div style="position: absolute; left: 36%; width: 28%; top: 48.5%; height: 8.5%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
        </div>
        <span style="position: absolute; left: 8px; bottom: 100px; padding: 1px 5px; border-radius: 4px; background: rgba(13,13,15,0.85); font-size: 9px; font-weight: 600">Original</span>
      </sc-if>
      <span style="position: absolute; right: 8px; top: 8px; padding: 2px 6px; border-radius: 5px; background: rgba(13,13,15,0.85); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; color: #FFD23F">{{chip}}</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div role="radiogroup" aria-label="Method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #17171A">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{m.pressed}}" onClick="{{m.pick}}" style="height: 40px; border-radius: 10px; background: {{m.bg}}; color: {{m.fg}}; font-size: 13px; font-weight: 600">{{m.label}}</button>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Show behind the subject</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{bgs}}" as="b" hint-placeholder-count="4">
          <button onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{b.bd}}; background: {{b.bg}}; color: {{b.fg}}; box-sizing: border-box; font-size: 12px; font-weight: 600">{{b.label}}</button>
        </sc-for>
      </div>
    </section>

    <sc-if value="{{isAi}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="height: 40px; display: flex; align-items: center; gap: 10px">
          <label for="edge" style="font-size: 13px; width: 96px">Edge refine</label>
          <input id="edge" type="range" min="0" max="100" value="{{edge}}" onChange="{{setEdge}}" style="flex: 1; accent-color: #FFD23F; height: 24px">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; width: 30px; text-align: right">{{edge}}</span>
        </div>
        <div style="height: 40px; display: flex; align-items: center; gap: 10px">
          <label for="hair" style="font-size: 13px; width: 96px">Hair detail</label>
          <input id="hair" type="range" min="0" max="100" value="70" style="flex: 1; accent-color: #FFD23F; height: 24px">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; width: 30px; text-align: right">70</span>
        </div>
        <p style="margin: 6px 0 0; font-size: 12px; color: #8C8B94; line-height: 1.4">Finds people on the phone, frame by frame. No green screen needed.</p>
      </div>
    </sc-if>

    <sc-if value="{{isChroma}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="height: 44px; display: flex; align-items: center; gap: 10px">
          <span style="font-size: 13px; width: 96px">Key color</span>
          <span style="width: 32px; height: 32px; border-radius: 8px; background: {{keyColor}}; border: 1px solid #3A3A40; display: block"></span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #A6A5AD; flex: 1">{{keyColor}}</span>
          <button aria-label="Pick key color from the preview" style="width: 44px; height: 44px; border-radius: 12px; background: #1F1F23; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-2 2-6-6zM12 6l-8 8v4h4l8-8"></path></svg>
          </button>
        </div>
        <sc-for list="{{chromaSliders}}" as="x" hint-placeholder-count="3">
          <div style="height: 38px; display: flex; align-items: center; gap: 10px">
            <label for="{{x.id}}" style="font-size: 13px; width: 96px">{{x.label}}</label>
            <input id="{{x.id}}" type="range" min="0" max="100" value="{{x.v}}" onChange="{{x.set}}" style="flex: 1; accent-color: #FFD23F; height: 24px">
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; width: 30px; text-align: right">{{x.v}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ai', bg: 'below', edge: 40, sim: 42, smooth: 18, spill: 60 };
  }
  renderVals() {
    const s = this.state || {};
    const isAi = s.mode === 'ai';
    const seg = (on) => ({ bg: on ? '#F4F3EF' : 'transparent', fg: on ? '#0D0D0F' : '#B4B3BB', pressed: on ? 'true' : 'false' });
    const BGS = [['below', 'Layer below'], ['blur', 'Blur'], ['clear', 'Clear'], ['color', 'Color']];
    const bgNames = { below: 'tram.mp4 from the layer below', blur: 'a blurred copy of the clip', clear: 'transparency', color: 'a solid color' };
    return {
      isAi, isChroma: !isAi,
      clipName: isAi ? 'sunset.mp4 · L3 · AI person cutout' : 'studio-take.mp4 · L3 · chroma key',
      chip: isAi ? 'Person found' : 'Keyed',
      keyColor: '#3BB34A',
      edgeGlow: String(Math.round(s.edge / 25)),
      bgBelow: s.bg === 'below', bgBlur: s.bg === 'blur', bgClear: s.bg === 'clear', bgColor: s.bg === 'color',
      previewLabel: 'Subject cut out ' + (isAi ? 'by on-device AI' : 'with a green chroma key') + ', shown over ' + bgNames[s.bg],
      modes: [['ai', 'Remove background (AI)'], ['chroma', 'Chroma key']].map(([id, label]) => ({ label, ...seg(id === s.mode), pick: () => this.setState({ mode: id }) })),
      bgs: BGS.map(([id, label]) => {
        const on = id === s.bg;
        return { label, bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#17171A', fg: on ? '#FFD23F' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ bg: id }) };
      }),
      edge: s.edge,
      setEdge: (e) => this.setState({ edge: Number(e.target.value) }),
      chromaSliders: [['sim', 'Similarity'], ['smooth', 'Smoothness'], ['spill', 'Spill removal']].map(([id, label]) => ({ id: 'k-' + id, label, v: s[id], set: (e) => this.setState({ [id]: Number(e.target.value) }) }))
    };
  }
}
</script>
</body>
</html>
