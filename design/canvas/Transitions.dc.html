<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Transitions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">Transition</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">sunset.mp4 → tram.mp4</span>
    </span>
    <button style="height: 44px; padding: 0 8px; color: #FFD23F; font-size: 13px; font-weight: 600">Apply to all</button>
    <a href="Editor.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #FFD23F; color: #141210; font-size: 14px; font-weight: 700; display: flex; align-items: center">Done</a>
  </header>

  <div style="position: relative; height: 240px; background: #000000; display: flex; align-items: center; justify-content: center">
    <div role="img" aria-label="{{previewLabel}}" style="position: relative; width: 135px; height: 240px; overflow: hidden; isolation: isolate; background: #000000">
      <div style="position: absolute; inset: 0; transform: {{sel.a}}; filter: {{sel.af}}">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
        <div style="position: absolute; left: 62%; top: 30%; width: 24%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
        <div style="position: absolute; left: -30%; right: 35%; top: 64%; height: 50%; border-radius: 50%; background: #4A3355"></div>
        <div style="position: absolute; left: 25%; right: -40%; top: 72%; height: 50%; border-radius: 50%; background: #22192E"></div>
        <div style="position: absolute; left: 21%; right: 21%; top: 74%; bottom: -6%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
        <div style="position: absolute; left: 45%; width: 10%; top: 66%; height: 10%; background: #B97A5B"></div>
        <div style="position: absolute; left: 37%; width: 26%; top: 50%; height: 18%; border-radius: 50%; background: #C98B6B"></div>
        <div style="position: absolute; left: 36%; width: 28%; top: 48.5%; height: 8.5%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
      </div>
      <div style="position: absolute; inset: 0; clip-path: {{sel.bc}}; transform: {{sel.bt}}; opacity: {{sel.bo}}; filter: {{sel.bf}}">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #16324F 0%, #2F6FA8 55%, #6E8FB5 100%)"></div>
        <div style="position: absolute; left: -5%; width: 45%; top: 26%; bottom: 30%; background-color: #24344D; background-image: radial-gradient(rgba(255,214,120,0.85) 1.5px, transparent 2px); background-size: 10px 12px"></div>
        <div style="position: absolute; right: -5%; width: 50%; top: 18%; bottom: 30%; background-color: #1E2B40; background-image: radial-gradient(rgba(255,214,120,0.7) 1.5px, transparent 2px); background-size: 11px 13px"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #1C2635"></div>
        <div style="position: absolute; left: 10%; right: 10%; top: 52%; height: 21%; border-radius: 12px 12px 4px 4px; background: #F2B705"></div>
        <div style="position: absolute; left: 15%; right: 15%; top: 55%; height: 7%; border-radius: 3px; background: repeating-linear-gradient(90deg, #1A2A3A 0 14px, #F2B705 14px 17px)"></div>
        <div style="position: absolute; left: 10%; right: 10%; top: 71%; height: 3%; background: #111111"></div>
      </div>
      <div style="position: absolute; inset: 0; background: {{sel.ov}}; mix-blend-mode: {{sel.ovb}}"></div>
      <sc-if value="{{sel.px}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: repeat(16, minmax(0, 1fr))">
          <sc-for list="{{pvCells}}" as="m" hint-placeholder-count="144">
            <span style="background: {{m.c}}; display: block"></span>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <span style="position: absolute; left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">{{sel.name}}</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">{{durText}} · midpoint</span>
    </span>
    <button aria-label="Play transition preview" style="position: absolute; right: 12px; bottom: 8px; width: 44px; height: 44px; border-radius: 22px; background: #1F1F23; display: flex; align-items: center; justify-content: center; color: #F4F3EF">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
    </button>
  </div>

  <div style="padding: 10px 16px 0; display: flex; align-items: center; gap: 6px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; margin: -4px; padding: 0 11px; border: 4px solid transparent; box-sizing: border-box; background-clip: padding-box; border-radius: 22px; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px">
        {{c.label}}
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; opacity: 0.7">{{c.n}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-content: start; flex: 1; min-height: 0">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="25">
      <button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="display: flex; flex-direction: column; gap: 5px; align-items: stretch; min-width: 0">
        <span style="position: relative; display: block; height: 48px; border-radius: 10px; overflow: hidden; isolation: isolate; background: #000000; box-shadow: 0 0 0 2px {{t.ring}}">
          <span style="position: absolute; inset: 0; display: block; background: linear-gradient(180deg, #6B4D7A 0%, #E0875A 70%, #3A2645 71%); transform: {{t.a}}; filter: {{t.af}}"></span>
          <span style="position: absolute; inset: 0; display: block; background: linear-gradient(180deg, #16324F 0%, #2F6FA8 48%, #F2B705 48%, #F2B705 76%, #1A1A1A 76%); clip-path: {{t.bc}}; transform: {{t.bt}}; opacity: {{t.bo}}; filter: {{t.bf}}"></span>
          <span style="position: absolute; inset: 0; display: block; background: {{t.ov}}; mix-blend-mode: {{t.ovb}}"></span>
          <span style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr))">
            <sc-for list="{{t.cells}}" as="m" hint-placeholder-count="0">
              <span style="background: {{m.c}}; display: block"></span>
            </sc-for>
          </span>
        </span>
        <span style="font-size: 11px; font-weight: 500; color: {{t.fg}}; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
      </button>
    </sc-for>
  </div>

  <div style="height: 52px; padding: 0 16px 26px; display: flex; align-items: center; gap: 12px">
    <label for="duration" style="font-size: 13px; font-weight: 600; width: 64px">Duration</label>
    <input id="duration" type="range" min="2" max="20" step="1" value="{{durTenths}}" onChange="{{setDur}}" style="flex: 1; accent-color: #FFD23F; height: 28px">
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; width: 44px; text-align: right">{{durText}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'whip', cat: 'all', dur: 6 };
  }
  renderVals() {
    const s = this.state || {};
    const stripes = 'repeating-linear-gradient(0deg, transparent 0 6px, rgba(0,255,234,0.5) 6px 8px, transparent 8px 13px, rgba(255,0,92,0.5) 13px 15px)';
    const T = [
      { id: 'none', name: 'None', cat: 'all', bo: '0' },
      { id: 'dissolve', name: 'Dissolve', cat: 'basic', bo: '0.5' },
      { id: 'fadeb', name: 'Fade black', cat: 'basic', bo: '0', ov: 'rgba(0,0,0,0.72)' },
      { id: 'fadew', name: 'Fade white', cat: 'basic', bo: '0', ov: 'rgba(255,255,255,0.7)' },
      { id: 'wipel', name: 'Wipe left', cat: 'basic', bc: 'inset(0 0 0 50%)' },
      { id: 'wiped', name: 'Wipe down', cat: 'basic', bc: 'inset(0 0 50% 0)' },
      { id: 'clock', name: 'Clock', cat: 'basic', bc: 'polygon(50% 50%, 50% -100%, 200% -100%, 200% 200%)' },
      { id: 'iris', name: 'Iris', cat: 'basic', bc: 'circle(32% at 50% 50%)' },
      { id: 'split', name: 'Split', cat: 'basic', bc: 'inset(0 30% 0 30%)' },
      { id: 'slidel', name: 'Slide left', cat: 'motion', bt: 'translateX(50%)' },
      { id: 'slideu', name: 'Slide up', cat: 'motion', bt: 'translateY(50%)' },
      { id: 'push', name: 'Push', cat: 'motion', a: 'translateX(-50%)', bt: 'translateX(50%)' },
      { id: 'zoomin', name: 'Zoom in', cat: 'motion', a: 'scale(1.6)', af: 'blur(2px)', bo: '0.35' },
      { id: 'zoomout', name: 'Zoom out', cat: 'motion', bt: 'scale(0.55)' },
      { id: 'whip', name: 'Whip pan', cat: 'motion', a: 'translateX(-30%)', af: 'blur(5px)', bc: 'inset(0 0 0 55%)', bf: 'blur(5px)', ov: 'repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0 2px, transparent 2px 9px)', ovb: 'screen' },
      { id: 'spin', name: 'Spin', cat: 'motion', bt: 'rotate(35deg) scale(0.7)' },
      { id: 'shake', name: 'Shake', cat: 'motion', a: 'translate(6px, -4px) rotate(-2deg)', bo: '0.4', bt: 'translate(-6px, 4px) rotate(2deg)' },
      { id: 'cube', name: 'Cube', cat: 'motion', a: 'perspective(300px) translateX(-50%) rotateY(-50deg)', bt: 'perspective(300px) translateX(50%) rotateY(50deg)' },
      { id: 'glitch', name: 'Glitch', cat: 'style', bc: 'inset(30% 0 40% 0)', bt: 'translateX(8%)', ov: stripes, ovb: 'screen' },
      { id: 'flash', name: 'Flash', cat: 'style', bo: '0.3', ov: 'radial-gradient(circle, rgba(255,255,255,0.95) 30%, rgba(255,255,255,0.6))' },
      { id: 'blur', name: 'Blur', cat: 'style', af: 'blur(6px)', bo: '0.5', bf: 'blur(6px)' },
      { id: 'pixel', name: 'Pixelate', cat: 'style', bo: '0', px: true },
      { id: 'leak', name: 'Light leak', cat: 'style', bo: '0.5', ov: 'radial-gradient(circle at 70% 30%, rgba(255,150,60,0.95), rgba(255,80,80,0.45) 40%, transparent 70%)', ovb: 'screen' },
      { id: 'burn', name: 'Film burn', cat: 'style', bo: '0.4', ov: 'radial-gradient(circle at 30% 60%, rgba(255,245,210,1) 0 10%, rgba(255,120,30,0.9) 25%, rgba(120,20,0,0.6) 45%, transparent 70%)', ovb: 'screen' },
      { id: 'ink', name: 'Ink', cat: 'style', bc: 'ellipse(42% 30% at 38% 60%)' }
    ].map((x) => ({ a: 'none', af: 'none', bc: 'none', bt: 'none', bo: '1', bf: 'none', ov: 'none', ovb: 'normal', px: false, ...x }));

    const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const toHex = (c) => '#' + c.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    const grad = (stops) => (t) => {
      for (let i = 1; i < stops.length; i++) {
        if (t <= stops[i][0]) {
          const a = stops[i - 1], b = stops[i];
          const k = (t - a[0]) / Math.max(0.0001, b[0] - a[0]);
          return hex(a[1]).map((v, j) => v + (hex(b[1])[j] - v) * k);
        }
      }
      return hex(stops[stops.length - 1][1]);
    };
    const A = grad([[0, '#23305C'], [0.36, '#6B4D7A'], [0.66, '#D9785A'], [0.72, '#4A3355'], [1, '#22192E']]);
    const B = grad([[0, '#16324F'], [0.5, '#2F6FA8'], [0.52, '#F2B705'], [0.72, '#F2B705'], [0.74, '#1C2635'], [1, '#1C2635']]);
    const pix = (cols, rows) => {
      const out = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const t = (r + 0.5) / rows;
        const w = ((c * 7 + r * 13) % 5) / 10 + 0.3;
        const a = A(t), b = B(t);
        out.push({ c: toHex(a.map((v, j) => v * (1 - w) + b[j] * w)) });
      }
      return out;
    };
    const tileCells = pix(6, 5);
    const pvCells = pix(9, 16);
    const sel = T.find((x) => x.id === s.pick) || T[0];
    const CATS = [['all', 'All', 24], ['basic', 'Basic', 8], ['motion', 'Motion', 9], ['style', 'Stylized', 7]];
    const shown = T.filter((x) => s.cat === 'all' || x.cat === s.cat || x.id === 'none');
    const durText = (s.dur / 10).toFixed(1) + ' s';
    return {
      sel, pvCells, durText,
      durTenths: s.dur,
      previewLabel: 'Midpoint of the ' + sel.name + ' transition from sunset.mp4 to tram.mp4',
      setDur: (e) => this.setState({ dur: Number(e.target.value) }),
      cats: CATS.map(([id, label, n]) => {
        const on = id === s.cat;
        return { label, n, bg: on ? '#F4F3EF' : '#17171A', fg: on ? '#0D0D0F' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ cat: id }) };
      }),
      tiles: shown.map((x) => {
        const on = x.id === sel.id;
        return { ...x, cells: x.px ? tileCells : [], ring: on ? '#FFD23F' : 'transparent', fg: on ? '#FFD23F' : '#B4B3BB', pressed: on ? 'true' : 'false', pick: () => this.setState({ pick: x.id }) };
      })
    };
  }
}
</script>
</body>
</html>
