<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - New project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 52px; padding: 0 20px 0 6px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Back to projects" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Geist', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">New project</h1>
  </header>

  <div style="flex: 1; min-height: 0; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 14px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Aspect ratio</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ratios}}" as="r" hint-placeholder-count="6">
          <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 74px; border-radius: 14px; border: 1.5px solid {{r.bd}}; background: {{r.bg}}; box-sizing: border-box; padding: 8px 10px; display: flex; align-items: center; gap: 8px; text-align: left">
            <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <span style="width: {{r.iw}}px; height: {{r.ih}}px; border: 2px solid {{r.ic}}; border-radius: 4px; box-sizing: border-box; display: block"></span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600">{{r.id}}</span>
              <span style="font-size: 11px; color: #A6A5AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.use}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Layout <span style="font-weight: 400; color: #8C8B94">- mosaic splits the frame into cells</span></h2>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{layouts}}" as="l" hint-placeholder-count="5">
          <button onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="height: 66px; border-radius: 14px; border: 1.5px solid {{l.bd}}; background: {{l.bg}}; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <span style="width: {{l.iw}}px; height: {{l.ih}}px; display: grid; grid-template-columns: {{l.gtc}}; grid-template-rows: {{l.gtr}}; gap: 2px">
              <sc-for list="{{l.cells}}" as="c" hint-placeholder-count="1">
                <span style="background: {{c.ic}}; border-radius: 2px; display: block"></span>
              </sc-for>
            </span>
            <span style="font-size: 11px; font-weight: 500">{{l.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Resolution</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #17171A">
        <sc-for list="{{res}}" as="x" hint-placeholder-count="4">
          <button onClick="{{x.pick}}" aria-pressed="{{x.pressed}}" style="height: 52px; border-radius: 12px; background: {{x.bg}}; color: {{x.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <span style="font-size: 15px; font-weight: 700">{{x.id}}</span>
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{x.sub}}">{{x.p}}p</span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{is4k}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; font-size: 12px; color: #A6A5AD">4K export needs a 2160p hardware encoder. Clipra checks this phone before you export.</p>
      </sc-if>
    </section>

    <section style="display: flex; gap: 14px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Frame rate</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #17171A">
          <sc-for list="{{fps}}" as="f" hint-placeholder-count="5">
            <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 44px; border-radius: 10px; background: {{f.bg}}; color: {{f.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600">{{f.v}}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Background <span style="font-weight: 400; color: #8C8B94">- fills empty space and text cards</span></h2>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{bgs}}" as="b" hint-placeholder-count="4">
          <button onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="height: 44px; padding: 0 12px 0 8px; border-radius: 22px; border: 1.5px solid {{b.bd}}; background: #17171A; display: flex; align-items: center; gap: 8px">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: {{b.sw}}; border: 1px solid #3A3A40; box-sizing: border-box; display: block"></span>
            <span style="font-size: 13px; font-weight: 500">{{b.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="padding: 12px 20px 26px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #1F1F23; background: #0D0D0F">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <span style="width: {{pw}}px; height: {{ph}}px; padding: 2px; box-sizing: border-box; border-radius: 4px; background: #6A6A72; display: grid; grid-template-columns: {{pgtc}}; grid-template-rows: {{pgtr}}; gap: 2px">
          <sc-for list="{{pcells}}" as="c" hint-placeholder-count="1">
            <span style="background: {{c.fill}}; border-radius: 1px; display: block"></span>
          </sc-for>
        </span>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{dims}}</span>
        <span style="font-size: 13px; color: #A6A5AD">{{summary}}</span>
      </span>
    </div>
    <a href="Editor.dc.html" style="height: 56px; border-radius: 16px; background: #FFD23F; color: #141210; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      Create project
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ratio: '9:16', res: 'FHD', fps: 30, layout: 'single', bg: 'black' };
  }
  renderVals() {
    const s = this.state || {};
    const RATIOS = [
      { id: '9:16', w: 9, h: 16, use: 'Reels' },
      { id: '16:9', w: 16, h: 9, use: 'YouTube' },
      { id: '1:1', w: 1, h: 1, use: 'Square' },
      { id: '4:5', w: 4, h: 5, use: 'Feed' },
      { id: '4:3', w: 4, h: 3, use: 'Classic' },
      { id: '21:9', w: 21, h: 9, use: 'Cinema' }
    ];
    const RES = [ { id: 'HD', p: 720 }, { id: 'FHD', p: 1080 }, { id: '2K', p: 1440 }, { id: '4K', p: 2160 } ];
    const FPS = [24, 25, 30, 50, 60];
    const LAYOUTS = [
      { id: 'single', label: 'Single' },
      { id: 'split2', label: 'Split 2' },
      { id: 'split3', label: 'Split 3' },
      { id: 'grid4', label: '2×2' },
      { id: 'grid9', label: '3×3' }
    ];
    const BGS = [
      { id: 'black', label: 'Black', sw: '#000000' },
      { id: 'white', label: 'White', sw: '#FFFFFF' },
      { id: 'yellow', label: 'Yellow', sw: '#FFD23F' },
      { id: 'blur', label: 'Blur', sw: 'linear-gradient(135deg, #6B4D7A, #D9785A)' }
    ];
    const ratio = RATIOS.find((r) => r.id === s.ratio) || RATIOS[0];
    const res = RES.find((r) => r.id === s.res) || RES[1];
    const portrait = ratio.h > ratio.w;
    const even = (n) => Math.round(n / 2) * 2;
    let W, H;
    if (ratio.w > ratio.h) { H = res.p; W = even(res.p * ratio.w / ratio.h); }
    else if (ratio.h > ratio.w) { W = res.p; H = even(res.p * ratio.h / ratio.w); }
    else { W = res.p; H = res.p; }
    const fit = (max) => ratio.w >= ratio.h
      ? { w: max, h: Math.round(max * ratio.h / ratio.w) }
      : { w: Math.round(max * ratio.w / ratio.h), h: max };
    const gridOf = (id) => {
      if (id === 'single') return { cols: 1, rows: 1 };
      if (id === 'split2') return portrait ? { cols: 1, rows: 2 } : { cols: 2, rows: 1 };
      if (id === 'split3') return portrait ? { cols: 1, rows: 3 } : { cols: 3, rows: 1 };
      if (id === 'grid4') return { cols: 2, rows: 2 };
      return { cols: 3, rows: 3 };
    };
    const sel = (on) => ({ bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#17171A', ic: on ? '#FFD23F' : '#B4B3BB', pressed: on ? 'true' : 'false' });
    const lay = gridOf(s.layout);
    const layoutObj = LAYOUTS.find((l) => l.id === s.layout) || LAYOUTS[0];
    const pv = fit(52);
    const cellsFor = (g) => Array.from({ length: g.cols * g.rows }, (_, i) => ({ i }));
    return {
      ratios: RATIOS.map((r) => {
        const box = r.w >= r.h ? { iw: 28, ih: Math.round(28 * r.h / r.w) } : { iw: Math.round(28 * r.w / r.h), ih: 28 };
        return { ...r, ...box, ...sel(r.id === ratio.id), pick: () => this.setState({ ratio: r.id }) };
      }),
      layouts: LAYOUTS.map((l) => {
        const g = gridOf(l.id);
        const box = fit(28);
        return {
          ...l, ...sel(l.id === s.layout), iw: box.w, ih: box.h,
          gtc: 'repeat(' + g.cols + ', minmax(0, 1fr))', gtr: 'repeat(' + g.rows + ', minmax(0, 1fr))',
          cells: cellsFor(g).map((c) => ({ ...c, ic: sel(l.id === s.layout).ic })), pick: () => this.setState({ layout: l.id })
        };
      }),
      res: RES.map((x) => {
        const on = x.id === res.id;
        return { ...x, bg: on ? '#FFD23F' : 'transparent', fg: on ? '#141210' : '#F4F3EF', sub: on ? '#3B3418' : '#A6A5AD', pressed: on ? 'true' : 'false', pick: () => this.setState({ res: x.id }) };
      }),
      fps: FPS.map((v) => {
        const on = v === s.fps;
        return { v, bg: on ? '#FFD23F' : 'transparent', fg: on ? '#141210' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ fps: v }) };
      }),
      bgs: BGS.map((b) => ({ ...b, bd: b.id === s.bg ? '#FFD23F' : '#2A2A30', pressed: b.id === s.bg ? 'true' : 'false', pick: () => this.setState({ bg: b.id }) })),
      is4k: res.id === '4K',
      dims: W + ' × ' + H,
      summary: ratio.id + ' · ' + res.id + ' · ' + s.fps + ' fps · ' + layoutObj.label,
      pw: pv.w, ph: pv.h,
      pgtc: 'repeat(' + lay.cols + ', minmax(0, 1fr))',
      pgtr: 'repeat(' + lay.rows + ', minmax(0, 1fr))',
      pcells: cellsFor(lay).map((c) => ({ ...c, fill: (BGS.find((b) => b.id === s.bg) || BGS[0]).sw })),
      pfill: (BGS.find((b) => b.id === s.bg) || BGS[0]).sw
    };
  }
}
</script>
</body>
</html>
