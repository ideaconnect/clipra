<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra tablet - Clipra Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 28px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; opacity: 0.35">
    <span style="height: 64px; border-bottom: 1px solid #1F1F23; display: block"></span>
    <span style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 792px">
      <span style="height: 84px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 84px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 84px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 84px; border-radius: 16px; background: #17171A; display: block"></span>
    </span>
    <span style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 792px">
      <span style="height: 150px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 150px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 150px; border-radius: 16px; background: #17171A; display: block"></span>
      <span style="height: 150px; border-radius: 16px; background: #17171A; display: block"></span>
    </span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <div role="dialog" aria-modal="true" aria-label="Clipra Pro" style="position: absolute; left: 240px; top: 110px; width: 800px; height: 580px; border-radius: 24px; background: #131316; border: 1px solid #2A2A30; box-sizing: border-box; display: flex; overflow: hidden">
    <div style="width: 340px; flex-shrink: 0; background: #1B1910; border-right: 1px solid #4A3F14; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
      <span style="width: 72px; height: 72px; border-radius: 22px; background: #FFD23F; color: #141210; display: flex; align-items: center; justify-content: center">
        <svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.5 3.7L12 5l4.5 7.2L21 8.5l-1.8 9H4.8z" fill="currentColor"></path><rect x="4.8" y="19" width="14.4" height="2" rx="1" fill="currentColor"></rect></svg>
      </span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Geist', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.02em; line-height: 1">{{headline}}</h1>
      <p style="margin: 0; font-size: 15px; color: #C9C2A2; line-height: 1.45">{{subline}}</p>
      <span style="flex: 1"></span>
      <sc-if value="{{notOwned}}" hint-placeholder-val="{{true}}">
        <span style="font-family: 'Bricolage Grotesque', 'Geist', sans-serif; font-weight: 800; font-size: 44px; color: #FFD23F; line-height: 1">10 PLN</span>
        <span style="font-size: 13px; color: #C9C2A2">one time · not a subscription</span>
      </sc-if>
    </div>
    <div style="flex: 1; min-width: 0; padding: 20px 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: flex-end">
        <a href="TabletHome.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin: -8px -12px 0 0; border-radius: 12px; color: #F4F3EF; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{perks}}" as="p" hint-placeholder-count="4">
          <li style="display: flex; gap: 12px; align-items: flex-start">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: #2B2716; color: #FFD23F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 600">{{p.title}}</span>
              <span style="font-size: 13px; color: #A6A5AD; line-height: 1.4">{{p.note}}</span>
            </span>
          </li>
        </sc-for>
      </ul>
      <span style="flex: 1"></span>
      <sc-if value="{{notOwned}}" hint-placeholder-val="{{true}}">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px">
          <button onClick="{{buy}}" style="height: 56px; border-radius: 16px; background: #FFD23F; color: #141210; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.5 3.7L12 5l4.5 7.2L21 8.5l-1.8 9H4.8z" fill="currentColor"></path><rect x="4.8" y="19" width="14.4" height="2" rx="1" fill="currentColor"></rect></svg>
            Buy Pro · 10 PLN
          </button>
          <button onClick="{{buy}}" style="height: 56px; padding: 0 18px; border-radius: 16px; background: #1F1F23; font-size: 14px; font-weight: 600">Restore purchase</button>
        </div>
      </sc-if>
      <sc-if value="{{owned}}" hint-placeholder-val="{{false}}">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px">
          <a href="TabletHome.dc.html" style="height: 56px; border-radius: 16px; background: #FFD23F; color: #141210; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Back to projects</a>
          <button onClick="{{reset}}" style="height: 56px; padding: 0 18px; border-radius: 16px; background: #1F1F23; font-size: 13px; font-weight: 600; color: #B4B3BB">Reset demo</button>
        </div>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 12px; color: #8C8B94; line-height: 1.5">Paid once through Google Play. Your exact price and currency show at checkout.</span>
        <button style="height: 44px; font-size: 12px; font-weight: 600; color: #B4B3BB; text-decoration: underline; text-underline-offset: 3px">Ad privacy choices</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { owned: false };
  }
  renderVals() {
    const s = this.state || {};
    const owned = !!s.owned;
    return {
      owned,
      notOwned: !owned,
      headline: owned ? 'You’re Pro' : 'Clipra Pro',
      subline: owned ? 'Ads are gone for good on this tablet and every other device on your Google account.' : 'One payment. No ads when you export, ever.',
      perks: [
        { title: 'No ads when you export', note: 'Both export ads disappear on every project, phone and tablet.' },
        { title: 'Nothing else changes', note: 'Every editing tool and on-device AI feature stays free for everyone.' },
        { title: 'Yours on every device', note: 'Linked to your Google Play account. Restore it any time.' },
        { title: 'Keeps Clipra independent', note: 'Pays for the on-device AI work, never with your data.' }
      ],
      buy: () => this.setState({ owned: true }),
      reset: () => this.setState({ owned: false })
    };
  }
}
</script>
</body>
</html>
