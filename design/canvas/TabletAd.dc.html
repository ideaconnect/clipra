<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra tablet - Export ad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; background: #000000; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; top: 32px; left: 24px; right: 24px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <span style="padding: 3px 8px; border-radius: 5px; background: #F4F3EF; color: #000000; font-size: 12px; font-weight: 700; letter-spacing: 0.02em">Ad</span>
    <sc-if value="{{counting}}" hint-placeholder-val="{{true}}">
      <span role="timer" aria-label="{{timerLabel}}" style="width: 40px; height: 40px; border-radius: 20px; border: 2px solid rgba(244,243,239,0.55); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600">{{secs}}</span>
    </sc-if>
    <sc-if value="{{canClose}}" hint-placeholder-val="{{false}}">
      <a href="TabletEditor.dc.html" aria-label="Close ad, export continues in the background" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(244,243,239,0.16); color: #F4F3EF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </sc-if>
  </div>

  <div role="img" aria-label="Placeholder for the landscape ad creative served by the ad network" style="position: absolute; top: 200px; left: 120px; width: 720px; height: 405px; border-radius: 18px; border: 1.5px dashed #3A3A40; box-sizing: border-box; background: repeating-linear-gradient(135deg, #111113 0 16px, #17171A 16px 32px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
    <span style="width: 72px; height: 72px; border-radius: 18px; background: #1F1F23; color: #8C8B94; display: flex; align-items: center; justify-content: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
    </span>
    <span style="font-size: 18px; font-weight: 600; color: #B4B3BB">[Ad creative, 16:9]</span>
    <span style="font-size: 13px; color: #8C8B94; line-height: 1.5">Same two slots as on the phone: when export starts and when it finishes.</span>
  </div>

  <div style="position: absolute; top: 200px; left: 872px; width: 288px; height: 405px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 16px; background: #2A2A30; display: block"></span>
    <span style="font-size: 22px; font-weight: 700; line-height: 1.2">[Ad headline]</span>
    <span style="font-size: 14px; color: #A6A5AD; line-height: 1.5">[Two or three lines of ad text from the advertiser, as delivered by the network.]</span>
    <span style="flex: 1"></span>
    <span style="font-size: 14px; font-weight: 600">[Advertiser]</span>
    <span style="height: 48px; border-radius: 24px; background: #F4F3EF; color: #000000; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">[Action]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: 5 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (s.secs <= 0) { clearInterval(this.timer); return; }
      this.setState({ secs: s.secs - 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = this.state || {};
    return {
      secs: s.secs,
      counting: s.secs > 0,
      canClose: s.secs <= 0,
      timerLabel: 'Ad can be closed in ' + s.secs + ' seconds'
    };
  }
}
</script>
</body>
</html>
