<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Edit by text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">Edit by text</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">Cuts ripple through every layer</span>
    </span>
    <a href="Editor.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #FFD23F; color: #141210; font-size: 14px; font-weight: 700; display: flex; align-items: center">Done</a>
  </header>

  <div style="height: 200px; padding: 0 16px; display: flex; align-items: center; gap: 16px; background: #000000">
    <div role="img" aria-label="Preview at the word Lisbon" style="position: relative; width: 113px; height: 200px; overflow: hidden; flex-shrink: 0">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
      <div style="position: absolute; left: 62%; top: 30%; width: 24%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
      <div style="position: absolute; left: -30%; right: 35%; top: 64%; height: 50%; border-radius: 50%; background: #4A3355"></div>
      <div style="position: absolute; left: 25%; right: -40%; top: 72%; height: 50%; border-radius: 50%; background: #22192E"></div>
      <div style="position: absolute; left: 21%; right: 21%; top: 74%; bottom: -6%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
      <div style="position: absolute; left: 45%; width: 10%; top: 66%; height: 10%; background: #B97A5B"></div>
      <div style="position: absolute; left: 37%; width: 26%; top: 50%; height: 18%; border-radius: 50%; background: #C98B6B"></div>
      <div style="position: absolute; left: 36%; width: 28%; top: 48.5%; height: 8.5%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
      <div style="position: absolute; left: 4px; right: 4px; bottom: 10px; display: flex; justify-content: center">
        <span style="padding: 2px 5px; border-radius: 4px; background: rgba(0,0,0,0.62); font-size: 8px; font-weight: 700; color: #FFFFFF; text-align: center">We finally made it to Lisbon</span>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; color: #A6A5AD">Length</span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8C8B94; text-decoration: {{origDeco}}">0:42.0</span>
        <span style="font-family: 'Bricolage Grotesque', 'Geist', sans-serif; font-size: 34px; font-weight: 800; line-height: 1">{{after}}</span>
      </span>
      <span style="font-size: 12px; color: #A6A5AD">{{cutSummary}}</span>
      <button aria-label="Play edited version" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F3EF; color: #0D0D0F; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
      </button>
    </div>
  </div>

  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button role="switch" aria-checked="{{fill.pressed}}" onClick="{{fill.toggle}}" style="height: 48px; border-radius: 12px; border: 1.5px solid {{fill.bd}}; background: {{fill.bg}}; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left">
        <span style="font-size: 13px; font-weight: 600; color: {{fill.fg}}">Cut filler words</span>
        <span style="font-size: 11px; color: #A6A5AD">{{fillNote}}</span>
      </button>
      <button role="switch" aria-checked="{{pause.pressed}}" onClick="{{pause.toggle}}" style="height: 48px; border-radius: 12px; border: 1.5px solid {{pause.bd}}; background: {{pause.bg}}; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left">
        <span style="font-size: 13px; font-weight: 600; color: {{pause.fg}}">Cut pauses</span>
        <span style="font-size: 11px; color: #A6A5AD">{{pauseNote}}</span>
      </button>
    </div>
    <div style="height: 36px; display: flex; align-items: center; gap: 10px">
      <label for="thr" style="font-size: 12px; color: #A6A5AD; width: 110px">Pauses longer than</label>
      <input id="thr" type="range" min="3" max="20" value="{{thr}}" onChange="{{setThr}}" style="flex: 1; accent-color: #FFD23F; height: 24px">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; width: 40px; text-align: right">{{thrText}}</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #8C8B94">{{g.head}}</span>
        <p style="margin: 0; line-height: 1.85">
          <sc-for list="{{g.tokens}}" as="k" hint-placeholder-count="20">
            <button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" aria-label="{{k.aria}}" style="display: inline; margin-right: 3px; padding: 1px 3px; border-radius: 5px; background: {{k.bg}}; color: {{k.fg}}; text-decoration: {{k.deco}}; text-underline-offset: 4px; font-family: {{k.ff}}; font-size: {{k.fs}}px; font-weight: {{k.fw}}">{{k.label}}</button>
          </sc-for>
        </p>
      </section>
    </sc-for>
  </div>

  <div style="padding: 10px 16px 26px; border-top: 1px solid #1F1F23; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #A6A5AD">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: rgba(255,90,54,0.35); display: block"></span>Cut</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="text-decoration: underline dotted #FFB547; text-underline-offset: 3px; color: #F4F3EF">um</span>Filler</span>
    <span style="flex: 1; text-align: right">Tap a word to cut or restore it</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fillers: true, pauses: true, thr: 5, manual: {} };
  }
  renderVals() {
    const s = this.state || {};
    const w = (t, at, d) => ({ kind: 'w', t, at, d });
    const f = (t, at, d) => ({ kind: 'f', t, at, d });
    const p = (at, d) => ({ kind: 'p', t: d.toFixed(1) + ' s', at, d });
    const SEGS = [
      { head: 'sunset.mp4 · tram.mp4 · clip audio · 00:05.5', tokens: [
        f('um', 5.5, 0.4), w('We', 6.0, 0.4), w('finally', 6.4, 0.5), w('made', 6.9, 0.4), w('it', 7.3, 0.3), w('to', 7.6, 0.3), w('Lisbon.', 7.9, 0.9),
        p(8.8, 0.6), w('The', 9.4, 0.3), w('light', 9.7, 0.4), w('here', 10.1, 0.3), w('is,', 10.4, 0.2), f('uh,', 10.6, 0.3), w('unreal.', 10.9, 0.7), p(11.6, 0.5)
      ] },
      { head: 'voiceover.m4a · L2 · 00:12.1', tokens: [
        w('Tomorrow', 12.1, 0.5), w('we’re', 12.6, 0.3), w('taking', 12.9, 0.4), w('the', 13.3, 0.2), w('tram', 13.5, 0.4), w('up', 13.9, 0.3), w('to', 14.2, 0.2), w('Alfama,', 14.4, 0.6),
        p(15.0, 0.6), w('and', 15.6, 0.2), w('then', 15.8, 0.4), f('um', 16.2, 0.4), w('the', 16.6, 0.2), w('train', 16.8, 0.4), w('out', 17.2, 0.3), w('to', 17.5, 0.2), w('Sintra,', 17.7, 0.5),
        p(18.2, 0.7), w('if', 18.9, 0.2), w('the', 19.1, 0.2), w('weather', 19.3, 0.5), w('holds,', 19.8, 0.6), f('you know.', 20.6, 0.4)
      ] }
    ];
    const thr = s.thr / 10;
    let cutTime = 0, cutCount = 0, fillCount = 0, pauseCount = 0;
    const segs = SEGS.map((g, gi) => ({
      head: g.head,
      tokens: g.tokens.map((k, ki) => {
        const id = gi + '-' + ki;
        let cut = !!s.manual[id];
        if (k.kind === 'f') { fillCount++; if (s.fillers) cut = !s.manual[id + '!'] ; }
        if (k.kind === 'p' && k.d > thr) { pauseCount++; if (s.pauses) cut = !s.manual[id + '!']; }
        if (cut) { cutTime += k.d; cutCount++; }
        const current = k.t === 'Lisbon.';
        let st = { bg: 'transparent', fg: '#F4F3EF', deco: 'none', ff: "'Geist', system-ui, sans-serif", fs: 16, fw: 400, label: k.t };
        if (k.kind === 'f') st.deco = 'underline dotted #FFB547';
        if (k.kind === 'p') st = { ...st, bg: '#1F1F23', fg: '#A6A5AD', ff: "'Geist Mono', ui-monospace, monospace", fs: 11, label: 'pause ' + k.t };
        if (current && !cut) st = { ...st, bg: '#FFD23F', fg: '#141210', fw: 600 };
        if (cut) st = { ...st, bg: 'rgba(255,90,54,0.2)', fg: '#FF8A70', deco: 'line-through' };
        const auto = (k.kind === 'f' && s.fillers) || (k.kind === 'p' && k.d > thr && s.pauses);
        return {
          ...st, pressed: cut ? 'true' : 'false',
          aria: (k.kind === 'p' ? 'Pause of ' + k.t : k.t) + (cut ? ', cut' : ''),
          pick: () => {
            const m = { ...s.manual };
            if (auto) { m[id + '!'] = !m[id + '!']; } else { m[id] = !m[id]; }
            this.setState({ manual: m });
          }
        };
      })
    }));
    const after = 42 - cutTime;
    const tog = (on, fn) => ({ pressed: on ? 'true' : 'false', bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#17171A', fg: on ? '#FFD23F' : '#F4F3EF', toggle: fn });
    return {
      segs,
      after: '0:' + after.toFixed(1).padStart(4, '0'),
      cutSummary: cutCount ? cutCount + (cutCount === 1 ? ' cut · ' : ' cuts · ') + cutTime.toFixed(1) + ' s shorter' : 'No cuts yet',
      origDeco: cutCount ? 'line-through' : 'none',
      fill: tog(s.fillers, () => this.setState({ fillers: !s.fillers })),
      pause: tog(s.pauses, () => this.setState({ pauses: !s.pauses })),
      fillNote: fillCount + ' found · um, uh, you know',
      pauseNote: pauseCount + ' longer than ' + thr.toFixed(1) + ' s',
      thr: s.thr,
      thrText: thr.toFixed(1) + ' s',
      setThr: (e) => this.setState({ thr: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
