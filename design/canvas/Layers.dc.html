<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Layers and blending</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">alfama.mp4 · layer L4</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">Video + audio · 00:05.00 – 00:08.60</span>
    </span>
    <a href="Editor.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #1F1F23; color: #F4F3EF; font-size: 14px; font-weight: 600; display: flex; align-items: center">Done</a>
  </header>

  <div style="height: 340px; background: #000000; display: flex; align-items: center; justify-content: center">
    <div role="img" aria-label="Preview: alfama.mp4 on layer L4 selected with transform handles, blended over sunset.mp4 on layer L3" style="position: relative; width: 191px; height: 340px; overflow: hidden">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
      <div style="position: absolute; left: 62%; top: 30%; width: 24%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
      <div style="position: absolute; left: -30%; right: 35%; top: 64%; height: 50%; border-radius: 50%; background: #4A3355"></div>
      <div style="position: absolute; left: 25%; right: -40%; top: 72%; height: 50%; border-radius: 50%; background: #22192E"></div>
      <div style="position: absolute; left: 21%; right: 21%; top: 74%; bottom: -6%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
      <div style="position: absolute; left: 45%; width: 10%; top: 66%; height: 10%; background: #B97A5B"></div>
      <div style="position: absolute; left: 37%; width: 26%; top: 50%; height: 18%; border-radius: 50%; background: #C98B6B"></div>
      <div style="position: absolute; left: 36%; width: 28%; top: 48.5%; height: 8.5%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
      <div style="position: absolute; left: 8%; top: 8%; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', 'Geist', sans-serif; font-weight: 800; font-size: 28px; line-height: 0.95; color: #FFFFFF; text-shadow: 0 2px 12px rgba(0,0,0,0.4)">DAY<br>ONE</span>
        <span style="font-size: 11px; font-weight: 600; color: #FFFFFF">Lisbon, PT</span>
      </div>

      <div style="position: absolute; left: 92px; top: 70px; width: 80px; height: 110px; border-radius: 6px; background: linear-gradient(180deg, #8DB9DA 0 34%, transparent 34%), linear-gradient(180deg, transparent 34%, #C4643C 34% 44%, transparent 44%), radial-gradient(rgba(70,45,30,0.55) 1px, transparent 1.5px) 0 0 / 8px 7px, repeating-linear-gradient(90deg, #F3E9D8 0 12px, #E9B98C 12px 21px, #F6F0E6 21px 30px, #D9A07A 30px 38px); mix-blend-mode: {{blendCss}}; opacity: {{opacityCss}}"></div>

      <div aria-hidden="true" style="position: absolute; left: 92px; top: 70px; width: 80px; height: 110px">
        <div style="position: absolute; inset: -4px; border: 1.5px dashed #FFD23F; border-radius: 2px"></div>
        <div style="position: absolute; left: -9px; top: -9px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #FFD23F"></div>
        <div style="position: absolute; right: -9px; top: -9px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #FFD23F"></div>
        <div style="position: absolute; left: -9px; bottom: -9px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #FFD23F"></div>
        <div style="position: absolute; right: -9px; bottom: -9px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #FFD23F"></div>
        <div style="position: absolute; left: 50%; top: -24px; width: 1.5px; height: 18px; background: #FFD23F"></div>
        <div style="position: absolute; left: calc(50% - 7px); top: -36px; width: 14px; height: 14px; border-radius: 7px; background: #FFD23F; display: flex; align-items: center; justify-content: center">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#141210" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"></path></svg>
        </div>
      </div>
      <span style="position: absolute; left: 64px; top: 192px; padding: 2px 6px; border-radius: 5px; background: rgba(13,13,15,0.85); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; color: #FFD23F">{{chip}}</span>
    </div>
  </div>

  <div role="tablist" aria-label="Layer settings" style="margin: 12px 16px 0; padding: 4px; border-radius: 14px; background: #17171A; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.pressed}}" onClick="{{t.pick}}" style="height: 40px; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 600">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isBlend}}" hint-placeholder-val="{{true}}">
    <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="16">
          <button onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 40px; border-radius: 10px; border: 1.5px solid {{m.bd}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 12px; font-weight: 600; box-sizing: border-box">{{m.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px">
        <label for="opacity" style="font-size: 13px; font-weight: 600; width: 60px">Opacity</label>
        <input id="opacity" type="range" min="0" max="100" value="{{opacity}}" onChange="{{setOpacity}}" style="flex: 1; accent-color: #FFD23F; height: 28px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; width: 40px; text-align: right">{{opacity}}%</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isTransform}}" hint-placeholder-val="{{false}}">
    <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="height: 52px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: #A6A5AD; width: 64px">Position X</span>
          <input type="text" inputmode="decimal" value="312 px" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F4F3EF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; text-align: right">
        </label>
        <label style="height: 52px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: #A6A5AD; width: 64px">Position Y</span>
          <input type="text" inputmode="decimal" value="−480 px" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F4F3EF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; text-align: right">
        </label>
        <label style="height: 52px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: #A6A5AD; width: 64px">Scale</span>
          <input type="text" inputmode="decimal" value="38 %" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F4F3EF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; text-align: right">
        </label>
        <label style="height: 52px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: #A6A5AD; width: 64px">Rotation</span>
          <input type="text" inputmode="decimal" value="0°" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F4F3EF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; text-align: right">
        </label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 10px; background: #1F1F23; font-size: 13px; font-weight: 600">Fit</button>
        <button style="height: 44px; border-radius: 10px; background: #1F1F23; font-size: 13px; font-weight: 600">Fill</button>
        <button style="height: 44px; border-radius: 10px; background: #1F1F23; font-size: 13px; font-weight: 600">Flip</button>
        <button style="height: 44px; border-radius: 10px; background: #1F1F23; font-size: 13px; font-weight: 600">Reset</button>
      </div>
      <button style="height: 48px; border-radius: 12px; border: 1.5px solid #FFD23F; color: #FFD23F; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"></path></svg>
        Add keyframe at 00:07.12
      </button>
    </div>
  </sc-if>

  <sc-if value="{{isLayers}}" hint-placeholder-val="{{false}}">
    <div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 2px">
        <p style="flex: 1; margin: 0; font-size: 12px; color: #A6A5AD; line-height: 1.35">Higher layers cover lower ones. Every layer plays its sound.</p>
        <button aria-label="Add a layer above L6" style="height: 44px; padding: 0 12px; flex-shrink: 0; border-radius: 12px; border: 1.5px dashed #3A3A40; box-sizing: border-box; font-size: 13px; font-weight: 600; color: #F4F3EF; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add layer
        </button>
      </div>
      <sc-for list="{{layers}}" as="l" hint-placeholder-count="4">
        <div style="height: 44px; border-radius: 12px; background: {{l.bg}}; border: 1.5px solid {{l.bd}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 6px">
          <span aria-hidden="true" style="color: #6E6D76; display: flex">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg>
          </span>
          <span style="width: 30px; height: 30px; border-radius: 8px; background: {{l.chip}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{l.short}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span>
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.meta}}</span>
          </span>
          <span style="display: flex; flex-shrink: 0">
            <button aria-label="{{l.eyeLabel}}" style="width: 38px; height: 40px; display: flex; align-items: center; justify-content: center; color: #B4B3BB">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <button aria-label="{{l.muteLabel}}" style="width: 38px; height: 40px; display: flex; align-items: center; justify-content: center; color: #B4B3BB">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path></svg>
            </button>
            <button aria-label="{{l.lockLabel}}" style="width: 38px; height: 40px; display: flex; align-items: center; justify-content: center; color: {{l.lockColor}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </button>
          </span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'blend', mode: 'screen', opacity: 85 };
  }
  renderVals() {
    const s = this.state || {};
    const MODES = [
      ['normal', 'Normal'], ['multiply', 'Multiply'], ['screen', 'Screen'], ['overlay', 'Overlay'],
      ['soft-light', 'Soft light'], ['hard-light', 'Hard light'], ['darken', 'Darken'], ['lighten', 'Lighten'],
      ['color-dodge', 'Dodge'], ['color-burn', 'Burn'], ['plus-lighter', 'Add'], ['difference', 'Difference'],
      ['exclusion', 'Exclusion'], ['hue', 'Hue'], ['color', 'Color'], ['luminosity', 'Luminosity']
    ];
    const TABS = [['blend', 'Blend'], ['transform', 'Transform'], ['layers', 'Layers']];
    const cur = MODES.find((m) => m[0] === s.mode) || MODES[1];
    const LAYERS = [
      { name: 'We finally made it to Lisbon', meta: 'Caption · 6.0–8.8 s', short: 'L6', chip: '#1F4FC2' },
      { name: 'Day one', meta: 'Text · 6.0–9.0 s', short: 'L5', chip: '#A8431A' },
      { name: 'alfama.mp4', meta: 'Video · 5.0–8.6 s', short: 'L4', chip: '#3A3A40', sel: true },
      { name: 'sunset.mp4', meta: 'Video · 0.0–9.2 s', short: 'L3', chip: '#3A3A40' },
      { name: 'Empty here', meta: 'Voiceover from 12.1 s', short: 'L2', chip: '#2A2A30' },
      { name: 'lisbon-guitar.mp3', meta: 'Music · 0–42 s', short: 'L1', chip: '#0E4F49' }
    ];
    return {
      tabs: TABS.map(([id, label]) => {
        const on = id === s.tab;
        return { label, bg: on ? '#F4F3EF' : 'transparent', fg: on ? '#0D0D0F' : '#B4B3BB', pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: id }) };
      }),
      isBlend: s.tab === 'blend',
      isTransform: s.tab === 'transform',
      isLayers: s.tab === 'layers',
      modes: MODES.map(([id, label]) => {
        const on = id === cur[0];
        return { label, bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#17171A', fg: on ? '#FFD23F' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ mode: id }) };
      }),
      blendCss: cur[0],
      opacity: s.opacity,
      opacityCss: String(s.opacity / 100),
      chip: cur[1] + ' · ' + s.opacity + '%',
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      layers: LAYERS.map((l) => ({
        ...l,
        bg: l.sel ? '#221F12' : '#17171A',
        bd: l.sel ? '#FFD23F' : '#17171A',
        lockColor: l.locked ? '#FFD23F' : '#6E6D76',
        eyeLabel: 'Hide layer ' + l.short,
        muteLabel: 'Mute layer ' + l.short,
        lockLabel: (l.locked ? 'Unlock layer ' : 'Lock layer ') + l.short
      }))
    };
  }
}
</script>
</body>
</html>
