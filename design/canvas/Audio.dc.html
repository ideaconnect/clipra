<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Audio cleanup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">Audio</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">sunset.mp4 · clip audio</span>
    </span>
    <a href="Editor.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #FFD23F; color: #141210; font-size: 14px; font-weight: 700; display: flex; align-items: center">Done</a>
  </header>

  <div style="flex: 1; min-height: 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 8px">

    <section style="border-radius: 16px; background: #131316; border: 1px solid #222227; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div role="tablist" aria-label="Compare audio" style="display: flex; padding: 3px; border-radius: 10px; background: #0D0D0F">
          <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
            <button role="tab" aria-selected="{{v.pressed}}" onClick="{{v.pick}}" style="height: 44px; margin: -6px 0; padding: 0 12px; border: 6px solid transparent; box-sizing: border-box; background-clip: padding-box; border-radius: 14px; background: {{v.bg}}; color: {{v.fg}}; font-size: 12px; font-weight: 600">{{v.label}}</button>
          </sc-for>
        </div>
        <span style="flex: 1"></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600">{{lufs}}</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">peak {{peak}}</span>
        </span>
      </div>
      <div role="img" aria-label="{{waveLabel}}" style="height: 64px; display: flex; align-items: center; gap: 2px; overflow: hidden">
        <sc-for list="{{wave}}" as="w" hint-placeholder-count="72">
          <span style="width: 2.8px; height: {{w.h}}px; border-radius: 2px; background: {{w.c}}; flex-shrink: 0; display: block"></span>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px; height: 40px">
      <label for="vol" style="font-size: 13px; font-weight: 600; width: 58px">Volume</label>
      <input id="vol" type="range" min="0" max="200" value="{{vol}}" onChange="{{setVol}}" style="flex: 1; accent-color: #FFD23F; height: 28px">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; width: 44px; text-align: right">{{vol}}%</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; color: #A6A5AD">Fade in</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600">0.5 s</span>
      </button>
      <button style="height: 44px; border-radius: 12px; background: #17171A; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; color: #A6A5AD">Fade out</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600">1.0 s</span>
      </button>
    </div>

    <section style="border-radius: 16px; background: #17171A; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px">
      <button role="switch" aria-checked="{{norm.pressed}}" onClick="{{norm.toggle}}" style="height: 44px; display: flex; align-items: center; gap: 12px; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">Normalize loudness</span>
          <span style="font-size: 12px; color: #A6A5AD">Even levels, peaks capped at −1 dBTP</span>
        </span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: {{norm.track}}; position: relative; display: block; flex-shrink: 0">
          <span style="position: absolute; top: 3px; left: {{norm.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: {{norm.knobColor}}; display: block"></span>
        </span>
      </button>
      <div role="radiogroup" aria-label="Loudness target" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; opacity: {{normOp}}">
        <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{t.pressed}}" onClick="{{t.pick}}" style="height: 50px; border-radius: 12px; border: 1.5px solid {{t.bd}}; background: {{t.bg}}; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; color: {{t.fg}}">{{t.v}}</span>
            <span style="font-size: 11px; color: #A6A5AD">{{t.use}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="border-radius: 16px; background: #17171A; padding: 4px 12px 8px; display: flex; flex-direction: column">
      <button role="switch" aria-checked="{{nr.pressed}}" onClick="{{nr.toggle}}" style="height: 44px; display: flex; align-items: center; gap: 12px; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">Noise reduction</span>
          <span style="font-size: 12px; color: #A6A5AD">Spectral gate for steady hum and hiss</span>
        </span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: {{nr.track}}; position: relative; display: block; flex-shrink: 0">
          <span style="position: absolute; top: 3px; left: {{nr.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: {{nr.knobColor}}; display: block"></span>
        </span>
      </button>
      <div style="height: 40px; display: flex; align-items: center; gap: 12px; opacity: {{nrOp}}">
        <label for="nrs" style="font-size: 12px; color: #A6A5AD; width: 58px">Strength</label>
        <input id="nrs" type="range" min="0" max="100" value="{{nrStrength}}" onChange="{{setNr}}" style="flex: 1; accent-color: #FFD23F; height: 28px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; width: 32px; text-align: right">{{nrStrength}}</span>
      </div>
    </section>

    <section style="border-radius: 16px; background: #17171A; padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 4px">
      <button role="switch" aria-checked="{{ai.pressed}}" onClick="{{ai.toggle}}" style="height: 44px; display: flex; align-items: center; gap: 12px; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 14px; font-weight: 600">AI voice cleanup</span>
            <span style="padding: 1px 6px; border-radius: 5px; background: #1F2A1F; color: #8FE388; font-size: 10px; font-weight: 700">On-device</span>
          </span>
          <span style="font-size: 12px; color: #A6A5AD">Cuts wind, traffic and room noise</span>
        </span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: {{ai.track}}; position: relative; display: block; flex-shrink: 0">
          <span style="position: absolute; top: 3px; left: {{ai.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: {{ai.knobColor}}; display: block"></span>
        </span>
      </button>
      <div role="radiogroup" aria-label="AI model" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; opacity: {{aiOp}}">
        <sc-for list="{{engines}}" as="e" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{e.pressed}}" onClick="{{e.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{e.bd}}; background: {{e.bg}}; box-sizing: border-box; padding: 0 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left">
            <span style="font-size: 13px; font-weight: 600; color: {{e.fg}}">{{e.name}}</span>
            <span style="font-size: 11px; color: #A6A5AD">{{e.note}}</span>
          </button>
        </sc-for>
      </div>
      <div style="height: 40px; display: flex; align-items: center; gap: 12px; opacity: {{aiOp}}">
        <label for="ais" style="font-size: 12px; color: #A6A5AD; width: 58px">Strength</label>
        <input id="ais" type="range" min="0" max="100" value="{{aiStrength}}" onChange="{{setAi}}" style="flex: 1; accent-color: #FFD23F; height: 28px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; width: 32px; text-align: right">{{aiStrength}}</span>
      </div>
    </section>

    <section style="border-radius: 16px; background: #17171A; padding: 0 12px">
      <button role="switch" aria-checked="{{duck.pressed}}" onClick="{{duck.toggle}}" style="width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">Duck music under this voice</span>
          <span style="font-size: 12px; color: #A6A5AD">Other clips drop 12 dB while it speaks</span>
        </span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: {{duck.track}}; position: relative; display: block; flex-shrink: 0">
          <span style="position: absolute; top: 3px; left: {{duck.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: {{duck.knobColor}}; display: block"></span>
        </span>
      </button>
    </section>
    <button style="height: 48px; border-radius: 14px; border: 1.5px solid #3A3A40; box-sizing: border-box; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
      Apply to all clips with speech
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'after', vol: 100, norm: true, target: -14, nr: false, nrStrength: 40, ai: true, engine: 'dfn', aiStrength: 70, duck: true };
  }
  renderVals() {
    const s = this.state || {};
    const sw = (on, toggle) => ({ pressed: on ? 'true' : 'false', track: on ? '#FFD23F' : '#2A2A30', knob: on ? 23 : 3, knobColor: on ? '#141210' : '#B4B3BB', toggle });
    const after = s.view === 'after';
    const cleaned = s.ai || s.nr;
    const gain = s.norm ? 1.7 : 1;
    const wave = [];
    for (let i = 0; i < 70; i++) {
      const gap = Math.sin(i * 0.11) < -0.55;
      const env = gap ? 0 : Math.max(0, Math.sin(i * 0.52)) * (0.55 + 0.45 * Math.abs(Math.sin(i * 0.137)));
      const noise = 7 + 5 * Math.abs(Math.sin(i * 2.31) * Math.cos(i * 0.71));
      const speech = env * 26;
      let h;
      if (!after) h = noise + speech;
      else h = (cleaned ? 2 + Math.abs(Math.sin(i * 1.9)) * 1.5 : noise) + speech * gain;
      h = Math.max(2, Math.min(62, Math.round(h * 0.78 * (s.vol / 100))));
      wave.push({ h, c: after ? (env > 0.05 ? '#5EE0C8' : '#2C6E64') : (env > 0.05 ? '#C9C8CF' : '#6E6D76') });
    }
    const TARGETS = [[-14, '−14 LUFS', 'Social, YouTube'], [-16, '−16 LUFS', 'Podcast, voice'], [-23, '−23 LUFS', 'Broadcast R128']];
    const ENGINES = [['dfn', 'DeepFilterNet 3', 'Best quality · 8 MB'], ['rnn', 'RNNoise', 'Lite, older phones']];
    const tgt = TARGETS.find((t) => t[0] === s.target) || TARGETS[0];
    return {
      views: [['before', 'Before'], ['after', 'After']].map(([id, label]) => {
        const on = id === s.view;
        return { label, bg: on ? '#F4F3EF' : 'transparent', fg: on ? '#0D0D0F' : '#B4B3BB', pressed: on ? 'true' : 'false', pick: () => this.setState({ view: id }) };
      }),
      wave,
      waveLabel: (after ? 'Processed' : 'Original') + ' waveform of speech with background noise' + (after && cleaned ? ' removed' : ''),
      lufs: after && s.norm ? tgt[1] : '−22.8 LUFS',
      peak: after && s.norm ? '−1.0 dBTP' : '−3.1 dBTP',
      vol: s.vol,
      setVol: (e) => this.setState({ vol: Number(e.target.value) }),
      norm: sw(s.norm, () => this.setState({ norm: !s.norm })),
      normOp: s.norm ? '1' : '0.4',
      targets: TARGETS.map(([v, label, use]) => {
        const on = v === s.target;
        return { v: label, use, bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#0D0D0F', fg: on ? '#FFD23F' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ target: v }) };
      }),
      nr: sw(s.nr, () => this.setState({ nr: !s.nr })),
      duck: sw(s.duck, () => this.setState({ duck: !s.duck })),
      nrOp: s.nr ? '1' : '0.4',
      nrStrength: s.nrStrength,
      setNr: (e) => this.setState({ nrStrength: Number(e.target.value) }),
      ai: sw(s.ai, () => this.setState({ ai: !s.ai })),
      aiOp: s.ai ? '1' : '0.4',
      aiStrength: s.aiStrength,
      setAi: (e) => this.setState({ aiStrength: Number(e.target.value) }),
      engines: ENGINES.map(([id, name, note]) => {
        const on = id === s.engine;
        return { name, note, bd: on ? '#FFD23F' : '#2A2A30', bg: on ? '#221F12' : '#0D0D0F', fg: on ? '#FFD23F' : '#F4F3EF', pressed: on ? 'true' : 'false', pick: () => this.setState({ engine: id }) };
      })
    };
  }
}
</script>
</body>
</html>
