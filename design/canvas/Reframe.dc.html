<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Auto-reframe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0D0F}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: #0D0D0F; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 48px; padding: 0 20px 0 6px; display: flex; align-items: center; gap: 6px">
    <a href="Editor.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F3EF; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 600">Auto-reframe</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #A6A5AD">Lisbon weekend · 16:9 → {{ratio}}</span>
    </span>
  </header>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 6px">
    <div role="img" aria-label="{{srcLabel}}" style="position: relative; width: 358px; height: 201px; overflow: hidden; border-radius: 6px">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
      <div style="position: absolute; left: 70%; top: 20%; width: 10%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
      <div style="position: absolute; left: -10%; right: 40%; top: 60%; height: 80%; border-radius: 50%; background: #4A3355"></div>
      <div style="position: absolute; left: 40%; right: -20%; top: 70%; height: 80%; border-radius: 50%; background: #22192E"></div>
      <div style="position: absolute; inset: 0; transform: translateX(14%)">
        <div style="position: absolute; left: 38%; right: 38%; top: 70%; bottom: -10%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
        <div style="position: absolute; left: 48.2%; width: 3.6%; top: 58%; height: 14%; background: #B97A5B"></div>
        <div style="position: absolute; left: 45.4%; width: 9.2%; top: 41%; height: 20%; border-radius: 50%; background: #C98B6B"></div>
        <div style="position: absolute; left: 45%; width: 10%; top: 39%; height: 10%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
      </div>
      <sc-if value="{{showPath}}" hint-placeholder-val="{{true}}">
        <sc-for list="{{path}}" as="d" hint-placeholder-count="7">
          <span aria-hidden="true" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.s}}px; height: {{d.s}}px; border-radius: 50%; background: #FFD23F; opacity: {{d.o}}; display: block"></span>
        </sc-for>
      </sc-if>
      <sc-if value="{{showFace}}" hint-placeholder-val="{{false}}">
        <span aria-hidden="true" style="position: absolute; left: 207px; top: 76px; width: 44px; height: 50px; border: 1.5px solid #8FE388; border-radius: 6px; display: block"></span>
      </sc-if>
      <div aria-hidden="true" style="position: absolute; top: 0; left: {{cropX}}px; width: {{cropW}}px; height: 201px; border: 2px solid #FFD23F; box-sizing: border-box; box-shadow: 0 0 0 999px rgba(13,13,15,0.62)"></div>
      <span style="position: absolute; left: 8px; bottom: 8px; padding: 2px 6px; border-radius: 5px; background: rgba(13,13,15,0.85); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px">Source 16:9 · 00:07.12</span>
    </div>
  </div>

  <div style="padding: 12px 16px 0; display: flex; align-items: center; gap: 14px">
    <div role="img" aria-label="{{outLabel}}" style="position: relative; width: {{outW}}px; height: 160px; overflow: hidden; border-radius: 6px; flex-shrink: 0; outline: 1px solid #2A2A30">
      <div style="position: absolute; left: 0; top: 0; width: 358px; height: 201px; transform-origin: 0 0; transform: scale(0.796) translateX({{outShift}}px)">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #23305C 0%, #6B4D7A 36%, #D9785A 66%, #F3B064 100%)"></div>
        <div style="position: absolute; left: 70%; top: 20%; width: 10%; aspect-ratio: 1; border-radius: 50%; background: #FFE6A8"></div>
        <div style="position: absolute; left: -10%; right: 40%; top: 60%; height: 80%; border-radius: 50%; background: #4A3355"></div>
        <div style="position: absolute; left: 40%; right: -20%; top: 70%; height: 80%; border-radius: 50%; background: #22192E"></div>
        <div style="position: absolute; inset: 0; transform: translateX(14%)">
          <div style="position: absolute; left: 38%; right: 38%; top: 70%; bottom: -10%; border-radius: 48% 48% 0 0; background: #2F4A7A"></div>
          <div style="position: absolute; left: 48.2%; width: 3.6%; top: 58%; height: 14%; background: #B97A5B"></div>
          <div style="position: absolute; left: 45.4%; width: 9.2%; top: 41%; height: 20%; border-radius: 50%; background: #C98B6B"></div>
          <div style="position: absolute; left: 45%; width: 10%; top: 39%; height: 10%; border-radius: 50% 50% 30% 30%; background: #2B1E1A"></div>
        </div>
      </div>
      <sc-if value="{{safe}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 6px; right: 6px; bottom: 12px; display: flex; justify-content: center">
          <span style="padding: 2px 4px; border-radius: 3px; background: rgba(0,0,0,0.65); font-size: 7px; font-weight: 700; color: #FFFFFF; text-align: center">We finally made it to Lisbon</span>
        </div>
      </sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600">Result · {{ratio}}</span>
      <span style="font-size: 12px; color: #A6A5AD; line-height: 1.45">Every shot is tracked on the phone. The crop follows the subject, and you can adjust the path later with keyframes.</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">New format</h2>
      <div role="radiogroup" aria-label="New format" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #17171A">
        <sc-for list="{{ratios}}" as="r" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{r.pressed}}" onClick="{{r.pick}}" style="height: 40px; border-radius: 10px; background: {{r.bg}}; color: {{r.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600">{{r.label}}</button>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #A6A5AD">Follow</h2>
      <div role="radiogroup" aria-label="Follow" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #17171A">
        <sc-for list="{{follows}}" as="f" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{f.pressed}}" onClick="{{f.pick}}" style="height: 40px; border-radius: 10px; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600">{{f.label}}</button>
        </sc-for>
      </div>
    </section>
    <div style="height: 36px; display: flex; align-items: center; gap: 10px">
      <label for="cam" style="font-size: 13px; width: 100px">Camera motion</label>
      <span style="font-size: 11px; color: #A6A5AD">Smooth</span>
      <input id="cam" type="range" min="0" max="100" value="{{cam}}" onChange="{{setCam}}" style="flex: 1; accent-color: #FFD23F; height: 24px">
      <span style="font-size: 11px; color: #A6A5AD">Quick</span>
    </div>
    <button role="switch" aria-checked="{{safeSw.pressed}}" onClick="{{safeSw.toggle}}" style="height: 44px; display: flex; align-items: center; gap: 12px; text-align: left">
      <span style="flex: 1; font-size: 14px; font-weight: 500">Keep titles and captions inside the frame</span>
      <span style="width: 48px; height: 28px; border-radius: 14px; background: {{safeSw.track}}; position: relative; display: block; flex-shrink: 0">
        <span style="position: absolute; top: 3px; left: {{safeSw.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: {{safeSw.knobColor}}; display: block"></span>
      </span>
    </button>
  </div>

  <div style="padding: 10px 16px 26px">
    <a href="Editor.dc.html" style="height: 56px; border-radius: 16px; background: #FFD23F; color: #141210; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Create {{ratio}} copy</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ratio: '9:16', follow: 'subject', cam: 30, safe: true };
  }
  renderVals() {
    const s = this.state || {};
    const R = { '9:16': 9 / 16, '1:1': 1, '4:5': 4 / 5 };
    const r = R[s.ratio] || R['9:16'];
    const W = 358, H = 201;
    const cropW = Math.round(H * r);
    const cx = s.follow === 'center' ? W / 2 : 229;
    const cropX = Math.max(0, Math.min(W - cropW, Math.round(cx - cropW / 2)));
    const seg = (on) => ({ bg: on ? '#F4F3EF' : 'transparent', fg: on ? '#0D0D0F' : '#B4B3BB', pressed: on ? 'true' : 'false' });
    const path = [];
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      path.push({ x: Math.round(130 + t * 96), y: Math.round(118 - Math.sin(t * Math.PI) * 10), s: i === 6 ? 8 : 5, o: String((0.3 + t * 0.7).toFixed(2)) });
    }
    const followNames = { subject: 'follows the subject', face: 'follows the face', center: 'stays centered' };
    return {
      ratio: s.ratio,
      cropW, cropX,
      outW: Math.round(160 * r),
      outShift: -cropX,
      showPath: s.follow !== 'center',
      showFace: s.follow === 'face',
      safe: s.safe,
      cam: s.cam,
      setCam: (e) => this.setState({ cam: Number(e.target.value) }),
      srcLabel: 'Source frame with a ' + s.ratio + ' crop window that ' + followNames[s.follow],
      outLabel: 'Reframed ' + s.ratio + ' result',
      ratios: Object.keys(R).map((id) => ({ label: id, ...seg(id === s.ratio), pick: () => this.setState({ ratio: id }) })),
      follows: [['subject', 'Subject'], ['face', 'Face'], ['center', 'Fixed']].map(([id, label]) => ({ label, ...seg(id === s.follow), pick: () => this.setState({ follow: id }) })),
      safeSw: { pressed: s.safe ? 'true' : 'false', track: s.safe ? '#FFD23F' : '#2A2A30', knob: s.safe ? 23 : 3, knobColor: s.safe ? '#141210' : '#B4B3BB', toggle: () => this.setState({ safe: !s.safe }) }
    };
  }
}
</script>
</body>
</html>
