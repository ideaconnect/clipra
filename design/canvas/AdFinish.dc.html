<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipra - Export ad 2 of 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#FFD23F;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; top: 40px; left: 14px; right: 14px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <span style="padding: 2px 7px; border-radius: 5px; background: #F4F3EF; color: #000000; font-size: 11px; font-weight: 700; letter-spacing: 0.02em">Ad</span>
    <sc-if value="{{counting}}" hint-placeholder-val="{{true}}">
      <span role="timer" aria-label="{{timerLabel}}" style="width: 36px; height: 36px; margin-right: 4px; border-radius: 18px; border: 2px solid rgba(244,243,239,0.55); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600">{{secs}}</span>
    </sc-if>
    <sc-if value="{{canClose}}" hint-placeholder-val="{{false}}">
      <a href="ExportDone.dc.html" aria-label="Close ad and open your saved video" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(244,243,239,0.16); color: #F4F3EF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </sc-if>
  </div>

  <div role="img" aria-label="Placeholder for a video ad served by the ad network" style="position: absolute; top: 100px; left: 0; right: 0; height: 420px; background: repeating-linear-gradient(135deg, #111113 0 14px, #17171A 14px 28px); border-top: 1.5px dashed #3A3A40; border-bottom: 1.5px dashed #3A3A40; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px">
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #1F1F23; color: #8C8B94; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg>
    </span>
    <span style="font-size: 16px; font-weight: 600; color: #B4B3BB">[Video ad]</span>
    <span style="font-size: 12px; color: #8C8B94; line-height: 1.5">Shown once the export has finished.<br>Closing it opens your saved video.</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 548px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 20px; font-weight: 700">[Ad headline]</span>
    <span style="font-size: 13px; color: #A6A5AD; line-height: 1.5">[Two lines of ad text from the advertiser, as delivered by the network.]</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 52px; height: 92px; border-radius: 18px; background: #141416; padding: 0 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
    <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #2A2A30; flex-shrink: 0; display: block"></span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 15px; font-weight: 600">[Advertiser]</span>
      <span style="font-size: 12px; color: #A6A5AD">[Sponsored]</span>
    </span>
    <span style="height: 40px; padding: 0 16px; border-radius: 20px; background: #F4F3EF; color: #000000; font-size: 13px; font-weight: 700; display: flex; align-items: center">[Action]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: 5 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (s.secs <= 0) { clearInterval(this.timer); return; }
      this.setState({ secs: s.secs - 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = this.state || {};
    return {
      secs: s.secs,
      counting: s.secs > 0,
      canClose: s.secs <= 0,
      timerLabel: 'Ad can be closed in ' + s.secs + ' seconds'
    };
  }
}
</script>
</body>
</html>
