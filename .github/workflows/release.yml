# Builds the signed release bundle for Google Play (#78) when a version tag (v1.2.3) is pushed.
# The keys are secrets of the "release" environment (docs/release/publishing.md). The bundle and
# the R8 mapping are attached to the run; they go to Play Console by hand.
#
# Actions are pinned to commit SHAs, as in ci.yml. There is no Gradle cache: a release is built
# from scratch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      # v1.2.3 becomes versionName 1.2.3 and versionCode 10203 (app/build.gradle.kts).
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the upload key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.CLIPRA_UPLOAD_KEYSTORE }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ORG_GRADLE_PROJECT_clipraUploadKeystore=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_clipraVersion: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_clipraUploadKeystorePassword: ${{ secrets.CLIPRA_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_clipraUploadKeyAlias: ${{ secrets.CLIPRA_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_clipraUploadKeyPassword: ${{ secrets.CLIPRA_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_clipraPlayLicenseKey: ${{ secrets.CLIPRA_PLAY_LICENSE_KEY }}
          ORG_GRADLE_PROJECT_clipraAdMobAppId: ${{ secrets.CLIPRA_ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_clipraAdUnitInterstitial: ${{ secrets.CLIPRA_AD_UNIT_INTERSTITIAL }}
        run: ./gradlew bundleRelease

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload the bundle and the mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipra-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
