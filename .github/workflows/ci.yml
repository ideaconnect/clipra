# Checks every pull request and every push to main: Kotlin style, the debug build, unit tests
# and Android lint. The debug APK is attached to each run.
#
# Actions are pinned to commit SHAs. Gradle caching comes from setup-java (MIT); we don't use
# gradle/actions/setup-gradle because its caching component is proprietary since v6.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image already has Android SDK platform 37 and the build tools. Native code
      # (RNNoise in ml:voice) builds with the NDK pinned in ml/voice/build.gradle.kts.
      - name: Install the NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Check Kotlin style (ktlint)
        run: ./gradlew spotlessCheck

      # The steps below still run after a style failure, so one run reports everything.
      - name: Build the debug APK
        id: assemble
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug

      - name: Upload the debug APK
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: ./gradlew testDebugUnitTest :core:model:test -Proborazzi.test.verify=true

      - name: Run Android lint
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: ./gradlew lintDebug

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
